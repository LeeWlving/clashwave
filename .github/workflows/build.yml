name: Build and release ClashWave

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: clashwave-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.5'
  MIHOMO_VERSION: '1.19.31'
  MIHOMO_ANDROID_WRAPPER_VERSION: '0.3.5'
  ANDROID_NDK_VERSION: '29.0.14033849'
  ANDROID_UPLOAD_SHA1: '89:5E:59:2D:BE:68:4F:CE:85:77:6D:3B:F3:72:39:B2:09:B0:C8:3F'
  WIX_VERSION: '6.0.2'
  INNO_CHINESE_SHA256: 'bf0751fa176569c6faa2f6e17ed2734617bef325d5cc06eae030fdd0258ee778'
  MIHOMO_WINDOWS_ZIP_SHA256: '38b2420799d9e7cde77ec1a19c7150dd17ca77f7fb82d9f62cb8763a307eee67'
  MIHOMO_ANDROID_AAR_SHA256: '41ddcce67de37f406377798c5adbc7ff925e6cd9cadbef3f187da3a03e564176'

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  android:
    name: Android App Bundle
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install pinned Android NDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${ANDROID_NDK_VERSION}"
      - name: Download and verify Android Mihomo bridge
        shell: bash
        run: |
          set -euo pipefail
          file="android/app/libs/libmihomo-android-v${MIHOMO_ANDROID_WRAPPER_VERSION}.aar"
          curl --fail --location --retry 3 \
            "https://github.com/oviron/libmihomo-android/releases/download/v${MIHOMO_ANDROID_WRAPPER_VERSION}/libmihomo-android-v${MIHOMO_ANDROID_WRAPPER_VERSION}.aar" \
            --output "$file"
          echo "${MIHOMO_ANDROID_AAR_SHA256}  $file" | sha256sum --check --strict
      - name: Configure upload signing
        if: env.HAS_ANDROID_SIGNING == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_EXPECTED_SHA1: ${{ env.ANDROID_UPLOAD_SHA1 }}
        run: bash scripts/configure-android-signing.sh
      - name: Require signing for published builds
        if: github.event_name != 'pull_request' && env.HAS_ANDROID_SIGNING != 'true'
        run: |
          echo 'All Android signing secrets are required for publishable builds.' >&2
          exit 1
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Android release artifacts
        run: |
          flutter build appbundle --release --no-pub
          flutter build apk --release --no-pub
      - name: Verify Android signatures
        if: env.HAS_ANDROID_SIGNING == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aab='build/app/outputs/bundle/release/app-release.aab'
          apk='build/app/outputs/flutter-apk/app-release.apk'
          jarsigner -verify "$aab"
          actual_sha1="$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          if [[ "$actual_sha1" != "$ANDROID_UPLOAD_SHA1" ]]; then
            echo "Unexpected Android signer: $actual_sha1" >&2
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "$apk"
      - name: Stage Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          cp build/app/outputs/bundle/release/app-release.aab \
            dist/android/ClashWave-android.aab
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/android/ClashWave-android.apk
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ClashWave-android
          path: dist/android/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Download and verify Mihomo
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mihomo.zip'
          Invoke-WebRequest `
            -Uri "https://github.com/MetaCubeX/mihomo/releases/download/v$env:MIHOMO_VERSION/mihomo-windows-amd64-v$env:MIHOMO_VERSION.zip" `
            -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:MIHOMO_WINDOWS_ZIP_SHA256) {
            throw "Mihomo checksum mismatch: $actual"
          }
          $extract = Join-Path $env:RUNNER_TEMP 'mihomo'
          Expand-Archive $archive -DestinationPath $extract -Force
          $core = Get-ChildItem $extract -Recurse -File -Filter 'mihomo*.exe' | Select-Object -First 1
          if ($null -eq $core) { throw 'mihomo.exe was not found in the release archive' }
          Copy-Item $core.FullName windows/core/mihomo.exe -Force
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Windows release
        run: flutter build windows --release --no-pub
      - name: Sign Windows application and service
        if: env.HAS_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'clashwave-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' `
            -Filter signtool.exe -Recurse -File |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) { throw 'signtool.exe was not found' }
          $targets = @(
            'build/windows/x64/runner/Release/clash_for_flutter.exe',
            'build/windows/x64/runner/Release/clashwave_service.exe'
          )
          foreach ($target in $targets) {
            & $signtool.FullName sign /fd SHA256 /td SHA256 `
              /tr 'http://timestamp.digicert.com' /f $certificate `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $signtool.FullName verify /pa /all $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          $version = $line.Matches[0].Groups[1].Value.Split('+')[0]
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Record Windows signing status
        id: windows_signing
        shell: pwsh
        run: |
          if ($env:HAS_WINDOWS_SIGNING -eq 'true') {
            'suffix=' >> $env:GITHUB_OUTPUT
            'Windows artifacts are Authenticode signed.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            'suffix=-unsigned' >> $env:GITHUB_OUTPUT
            '### Warning: Windows artifacts are unsigned' >> $env:GITHUB_STEP_SUMMARY
            'A trusted Windows certificate or SignPath integration has not been configured yet.' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Create portable archive
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          $output = 'dist/ClashWave-${{ steps.version.outputs.value }}-windows-x64${{ steps.windows_signing.outputs.suffix }}-portable.zip'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "$release/*" -DestinationPath $output -Force
      - name: Create installer
        shell: pwsh
        run: |
          $language = 'C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl'
          if (-not (Test-Path $language)) {
            Invoke-WebRequest `
              -Uri 'https://raw.githubusercontent.com/kira-96/Inno-Setup-Chinese-Simplified-Translation/1ff90acc4ed4aee82b1cda43253243deee3daed4/ChineseSimplified.isl' `
              -OutFile $language
            $actual = (Get-FileHash $language -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $env:INNO_CHINESE_SHA256) {
              throw "Inno Setup language checksum mismatch: $actual"
            }
          }
          $template = Get-Content windows/packaging/exe/inno_setup.iss -Raw
          $template = $template.Replace('{{APP_VERSION}}', '${{ steps.version.outputs.value }}')
          $template | Set-Content build/windows/setup.iss -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /Q build/windows/setup.iss
          if ('${{ steps.windows_signing.outputs.suffix }}' -ne '') {
            $installer = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
            if ($null -eq $installer) { throw 'The Windows EXE installer was not found' }
            $unsignedName = $installer.Name.Replace('-setup.exe', '-unsigned-setup.exe')
            Rename-Item -LiteralPath $installer.FullName -NewName $unsignedName
          }
      - name: Create MSI installer
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install --tool-path $tools wix --version $env:WIX_VERSION
          $wix = Join-Path $tools 'wix.exe'
          $release = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $assets = (Resolve-Path 'windows/runner/resources').Path
          $output = "dist/ClashWave-${{ steps.version.outputs.value }}-windows-x64${{ steps.windows_signing.outputs.suffix }}.msi"
          & $wix build windows/packaging/msi/product.wxs `
            -arch x64 `
            -d "AppVersion=${{ steps.version.outputs.value }}" `
            -bindpath "Release=$release" `
            -bindpath "Assets=$assets" `
            -intermediateFolder build/windows/wix `
            -o $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Flutter bundles its icon fonts as application data, not as system
          # fonts. ICE60 misclassifies their .otf/.ttf extensions here.
          & $wix msi validate $output -sice ICE60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign and verify Windows installers
        if: env.HAS_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'clashwave-signing.pfx'
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' `
            -Filter signtool.exe -Recurse -File |
            Where-Object FullName -Match '\\x64\\signtool\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          $installers = @(
            Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
            Get-ChildItem dist -Filter '*.msi' | Select-Object -First 1
          )
          foreach ($installer in $installers) {
            if ($null -eq $installer) { throw 'A Windows installer was not found' }
            & $signtool.FullName sign /fd SHA256 /td SHA256 `
              /tr 'http://timestamp.digicert.com' /f $certificate `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $signtool.FullName verify /pa /all $installer.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item -LiteralPath $certificate -Force
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ClashWave-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.msi
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Download and verify universal Mihomo
        run: sh macos/prepare_core.sh
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test menu-bar presentation and native dialog contracts
        run: >-
          flutter test test/desktop_presentation_test.dart test/native_dialogs_test.dart
          test/profile_importer_test.dart test/app_json_test.dart test/tray_menu_lifetime_test.dart
      - name: Build macOS release
        run: flutter build macos --release --no-pub
      - name: Read app version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          echo "value=${version%%+*}" >> "$GITHUB_OUTPUT"
      - name: Create and verify DMG
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: bash scripts/create-macos-dmg.sh "$APP_VERSION"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClashWave-macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libnotify-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Download and verify Mihomo
        run: sh linux/prepare_core.sh
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Linux release
        run: flutter build linux --release --no-pub
      - name: Read app version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          echo "value=${version%%+*}" >> "$GITHUB_OUTPUT"
      - name: Create portable archive
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf \
            "dist/ClashWave-${{ steps.version.outputs.value }}-linux-x64.tar.gz" .
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClashWave-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Collect and publish release assets
    needs: [android, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ClashWave-*
          path: raw-assets
      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp raw-assets/ClashWave-android/ClashWave-android.aab \
            release-assets/ClashWave-android.aab
          cp raw-assets/ClashWave-android/ClashWave-android.apk \
            release-assets/ClashWave-android.apk
          if compgen -G 'raw-assets/ClashWave-windows-x64/*-unsigned-*' >/dev/null; then
            windows_suffix='-unsigned'
          else
            windows_suffix=''
          fi
          cp raw-assets/ClashWave-windows-x64/*-portable.zip \
            "release-assets/ClashWave-windows-x64${windows_suffix}-portable.zip"
          cp raw-assets/ClashWave-windows-x64/*-setup.exe \
            "release-assets/ClashWave-windows-x64${windows_suffix}-setup.exe"
          cp raw-assets/ClashWave-windows-x64/*.msi \
            "release-assets/ClashWave-windows-x64${windows_suffix}.msi"
          cp raw-assets/ClashWave-macos-universal/*.dmg \
            release-assets/ClashWave-macos-universal.dmg
          cp raw-assets/ClashWave-linux-x64/*.tar.gz \
            release-assets/ClashWave-linux-x64.tar.gz
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
      - name: Upload complete release bundle
        uses: actions/upload-artifact@v7
        with:
          name: ClashWave-release-assets
          path: release-assets/*
          if-no-files-found: error
          overwrite: true
      - name: Publish GitHub release
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if compgen -G 'release-assets/ClashWave-windows-x64-unsigned*' >/dev/null; then
            windows_notice='Warning: Windows EXE/MSI/ZIP artifacts are currently unsigned. Android AAB/APK artifacts are signed and verified.'
          else
            windows_notice='Android and Windows artifacts are signed and verified.'
          fi
          if [[ "$RELEASE_TAG" == nightly ]]; then
            printf '%s\n\n%s\n\n%s\n\n%s\n' \
              'Development build from master. macOS is not notarized.' \
              "$windows_notice" \
              "Commit: $GITHUB_SHA" "Build: $RUN_URL" > release-notes.md
            if gh release view nightly >/dev/null 2>&1; then
              gh release upload nightly release-assets/* --clobber
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
                -f sha="$GITHUB_SHA" -F force=true
              gh release edit nightly --title 'ClashWave development build' \
                --notes-file release-notes.md --prerelease --latest=false
            else
              gh release create nightly release-assets/* --target "$GITHUB_SHA" \
                --title 'ClashWave development build' --notes-file release-notes.md \
                --prerelease --latest=false
            fi
          elif gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag \
              --title "ClashWave $RELEASE_TAG" --generate-notes \
              --notes "$windows_notice"
          fi
          printf 'Release: https://github.com/%s/releases/tag/%s\n' \
            "$GH_REPO" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
